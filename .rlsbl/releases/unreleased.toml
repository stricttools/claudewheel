# strictspec document version gate (do not remove)
format_version = 1
# Version bump type: patch, minor, major, infra, or prerelease
#   prerelease: advance an existing pre-release (0.6.0-beta.0 -> -beta.1)
bump = "patch"
# Short description of this release (required)
description = "Remove the claude-fable-5[1m] model option, which could never differ from plain Fable 5"
# Optional context explaining why these changes were made
context = """
Fable 5 runs at 1M context unconditionally. The client's model registry marks it
native_1m and, unlike Opus, withholds the supports_1m_suffix flag, so a [1m]
suffix on it was stripped before the request was sent -- verified end to end:
selecting claude-fable-5[1m] reported model claude-fable-5 with a 1,000,000
token window, identical to the plain id.

The option therefore offered a choice that did not exist, and when an unrelated
usage-credits dialog appeared it read as though 1M context were the thing being
refused. It was not; direct API probes at 396k input tokens returned 200 with
and without the 1M beta header.

Removing it from the defaults does not reach an options.json that already lists
it, so a migration cleans values, pinned, and metadata. The entry stays in
HISTORICAL_DEFAULTS, which records what ever shipped rather than what currently
does -- migration 3 reads it to tell a former default apart from a user-added
value.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). With patch/minor/major it ENTERS the
# channel (0.5.2 + minor + alpha -> 0.6.0-alpha.0); with
# bump = "prerelease" it promotes, and "stable" strips the
# suffix. See docs/release-workflow.md#the-pre-release-channel.
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["npm", "pypi"]
exclude = []
