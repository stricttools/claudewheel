# strictspec document version gate (do not remove)
format_version = 1
# Version bump type: patch, minor, major, infra, or prerelease
#   prerelease: advance an existing pre-release (0.6.0-beta.0 -> -beta.1)
bump = "minor"
# Short description of this release (required)
description = "Quieter Claude Code sessions: launches disable the client self-updater and feature-flag evaluation, Remote Control auto-connect and spinner tips are off in every managed profile, the post-update summary is suppressed, and the launcher no longer offers plan mode."
# Optional context explaining why these changes were made
context = """
Claude Code 2.1.263 shows several startup notices that a claudewheel user
never wants: an auto-updater that installs over claudewheel's managed
versions, a server-delivered model-upsell tip, Remote Control connection
status, and a post-update changelog summary after every version switch.
Each was traced to its actual switch in the client. The updater and the
feature-flag system are only reachable through environment variables, so
the launch injects them; Remote Control auto-connect and spinner tips are
settings.json keys, so they joined the canonical model that the exact
reconcile enforces; the post-update summary has no switch at all and is
prevented by marking the launched version as already seen before exec.
Plan mode cannot be removed from the client's own Shift+Tab cycle, so the
launcher stops offering it instead, and a stale saved plan selection is
reset to default so it can never fall through to a bypass launch.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). With patch/minor/major it ENTERS the
# channel (0.5.2 + minor + alpha -> 0.6.0-alpha.0); with
# bump = "prerelease" it promotes, and "stable" strips the
# suffix. See docs/release-workflow.md#the-pre-release-channel.
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["npm", "pypi"]
exclude = []
