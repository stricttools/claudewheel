version: 2

# The archives are named <binary>_<version>_<os>_<arch>.tar.gz, the names the
# npm and PyPI packaging jobs download, for every platform of rlsbl's
# platform table.
project_name: claudewheel

builds:
  - main: ./cmd/claudewheel
    binary: claudewheel
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{.Version}}
    # claudewheel runs only on Linux: it starts sessions in systemd user
    # scopes and reads /proc and cgroups, and its terminal code uses Linux
    # ioctls, so no darwin build exists.
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

