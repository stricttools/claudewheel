[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudewheel"
version = "0.32.1"
description = "A TUI Claude Code Launcher that lets you have more than one profile, manage sessions lifecycle, pick the exact CC version, model to use (even older unlisted ones), pick which GitHub account to use, etc."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "smm-h", email = "smmh72@gmail.com" },
]
keywords = [
    "claude",
    "claude-code",
    "launcher",
    "tui",
    "cli",
    "profiles",
    "permissions",
    "terminal",
    "rlsbl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "strictcli>=0.41.1",
    "strictspec>=0.2.4",
]

[project.scripts]
claudewheel = "claudewheel.cli:main"

[project.urls]
Homepage = "https://smmh.dev/claudewheel/"
Documentation = "https://smmh.dev/claudewheel/"
Repository = "https://github.com/smm-h/claudewheel"
Issues = "https://github.com/smm-h/claudewheel/issues"
Changelog = "https://github.com/smm-h/claudewheel/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["claudewheel"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "stricttest>=0.2.0",
]

[tool.pytest.ini_options]
# stricttest's isolation floor. Installing the plugin IS adoption; these five
# keys are required and have no defaults, on purpose.
#
# claudewheel is the highest-value target in the fleet for this floor. It owns
# ~/.claudewheel/: every profile directory, every profile's settings.json, the
# shared session store, and each profile's own token.json -- a long-lived
# Anthropic OAuth token per profile, stored inside the profile directory.
# Its suite drives the real CLI entry point end to end and its wizard
# shells out to `claude auth login` and `claude setup-token`. Before the floor,
# safety rested on each test remembering to set CLAUDEWHEEL_CONFIG_DIR or mock
# the subprocess; the throwaway HOME removes the real store and the ambient
# credentials outright, so a forgotten redirect fails instead of rewriting the
# developer's live profiles.
#
# sockets = "deny" with both allowlists empty: nothing in this suite
# legitimately reaches the network. Every network call the package makes goes
# through the HTTP surface in claudewheel/effects.py, and every test that
# exercises one of those call sites stubs the transport.
#
# loopback = "deny": there is no local server anywhere in the suite. The PTY
# tests use pty.fork and socketpair-free pipes, not sockets.
#
# sandbox_required = "false" because this repo has no sandbox runner yet; the
# always-on env/push/chdir/socket guards apply regardless.
stricttest_sockets = "deny"
stricttest_socket_allowlist = []
stricttest_unix_socket_allowlist = []
stricttest_loopback = "deny"
stricttest_sandbox_required = "false"

[tool.ruff]
# claudewheel/strictspec_gen/ holds the strictspec-generated validators. They
# are machine-written in strictspec's own emitted style and compared BYTE FOR
# BYTE by `strictspec check`, so reformatting one makes the freshness check
# fail. The fix for anything wrong in there is to edit
# .strictspec/lifecycle-event.schema.toml and regenerate.
#
# `extend-exclude` (not `include`) on purpose: the scope of the lint and format
# checks stays declared in .rlsbl/config.json, and rlsbl's scope guard polices
# `include`/`extend-include` only.
extend-exclude = ["claudewheel/strictspec_gen"]

[tool.ruff.lint]
# Pin ruff's current default rule families explicitly rather than relying on
# the implicit default. This keeps the enforced rule set stable across ruff
# upgrades that may change what "default" means.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
strict = true
# No `files` here on purpose: the mypy scope is owned solely by rlsbl's
# built-in `type-check` check, configured under `checks.type-check` in
# .rlsbl/config.json (paths: claudewheel, tests, docs), and rlsbl's
# type-check-scope-guard fails if a competing scope reappears here. A bare
# `uv run mypy` (no args) errors with "no files to check" rather than silently
# checking a subset.
#
# `exclude` is not scope: it prunes recursive discovery inside the paths the
# check already declares, so the scope guard (which polices `files`/`packages`/
# `modules`) is untouched. docs/_build/ is the gitignored selfdoc output tree; it
# holds a byte copy of docs/_directives/guardrail_table.py, and mypy refuses to
# check two files that map to one module name ("Duplicate module named
# guardrail_table"), aborting the whole run. Excluding the build tree keeps the
# real docs/ sources checked.
exclude = ["^docs/_build/"]

# The strictspec-generated validators are machine-written and byte-compared by
# `strictspec check`; they are not annotated to mypy's strict standard and
# cannot be edited to become so. Their errors are silenced; every call INTO
# them from claudewheel code is still checked strictly, because the stubs mypy
# infers for the generated module's public functions are unaffected by this.
[[tool.mypy.overrides]]
module = "claudewheel.strictspec_gen.*"
ignore_errors = true
