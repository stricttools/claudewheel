format_version = 1

[[accepted]]
word = "cgroup"
meaning = "a Linux control group, the kernel's unit of process grouping and resource accounting that systemd scopes are built on"

[[accepted]]
word = "claudewheel"
meaning = "This project: a CLI that manages multiple Claude Code profiles (separate config directories with their own credentials, settings, and hooks) and launches Claude Code under one."

[[accepted]]
word = "Jupyter"
meaning = "the notebook system whose Claude Code tool claudewheel strips"

[[accepted]]
word = "miniclaude"
meaning = "An alternative REPL client for Claude, offered alongside the official claude CLI in the launcher's client step."

[[accepted]]
word = "rewake"
meaning = "Claude Code's asyncRewake: a background hook that exits 2 wakes the session with its output"

[[accepted]]
word = "rlsbl"
meaning = "the release tool claudewheel is released with"

[[accepted]]
word = "safegit"
meaning = "the concurrency-safe git commit tool claudewheel's guardrails point agents to"

[[accepted]]
word = "saferm"
meaning = "A file-deletion tool that archives a path with an audit trail before removing it, so it can be restored with 'saferm undelete'; profile delete uses it."

[[accepted]]
word = "strictspec"
meaning = "the StrictTools schema tool that owns the shape of claudewheel's store files"

[[accepted]]
word = "tsv"
meaning = "Tab-separated values, the flat output format of the permission listing."

[[accepted]]
word = "unrouted"
meaning = "an OOM kill no session and no probe subscription took, recorded and listed rather than dropped"

[[accepted]]
word = "zram"
meaning = "the Linux kernel's compressed swap device held in RAM"
