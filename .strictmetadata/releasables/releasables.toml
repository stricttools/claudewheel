format_version = 1
repository_layout = "standalone"
release_branches = ["main", "master"]
environment_file = "~/Projects/.env"

[timeouts]
push_seconds = 120

[[releasables]]
name = "claudewheel"
tag_format = "v{version}"
publish_mode = "ci"

[[members]]
path = "."
name = "root"
releasable = "claudewheel"
targets = [{ name = "go" }]

[[members.pipelines]]
name = "go"
type = "go"
target = "go"
local = false
artifact = "binary"
install_paths = ["./cmd/claudewheel"]
