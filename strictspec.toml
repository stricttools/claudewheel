# strictspec manifest for claudewheel. Generation is file-driven: declare each
# schema and its targets, then run `strictspec gen`. Generated validators land
# under internal/schema/<package>/ (committed, read-only 0444).
# `strictspec check` verifies schema authoring validity and generated-code
# freshness.
format_version = 1

[[schemas]]
path = ".strictspec/lifecycle-event.schema.toml"

  [[schemas.targets]]
  lang    = "go"
  output  = "internal/schema/lifecycleevent/lifecycle_event_gen.go"
  package = "lifecycleevent"

[[schemas]]
path = ".strictspec/probe-event.schema.toml"

  [[schemas.targets]]
